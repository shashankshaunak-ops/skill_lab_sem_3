<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Corner</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">🍽️</div>
    <p class="eyebrow">YOUR CAMPUS CANTEEN</p>
    <h1>Canteen Corner</h1>

    <section id="welcome-page" aria-labelledby="welcome-title">
      <h2 id="welcome-title">Let's get to know you</h2>
      <p class="intro">Enter your details to get started.</p>

      <form id="welcome-form">
        <label for="customer-name">Your name</label>
        <input
          id="customer-name"
          name="name"
          type="text"
          placeholder="e.g. Alex"
          autocomplete="name"
          required
        >

        <label for="customer-phone">Phone number</label>
        <input
          id="customer-phone"
          name="phone"
          type="tel"
          placeholder="10-digit phone number"
          autocomplete="tel"
          inputmode="numeric"
          pattern="[0-9]{10}"
          title="Please enter a 10-digit phone number."
          required
        >

        <button class="continue-button" type="submit">Enter <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <section id="food-page" aria-labelledby="food-title" hidden>
      <h2 id="food-title">What would you like, <span id="customer-greeting"></span>?</h2>
      <p class="intro">Choose your food preference.</p>

      <div class="food-options">
        <button class="food-option veg-option" type="button" aria-pressed="false">
          <span class="food-icon" aria-hidden="true"></span>
          <span class="food-name">Vegetarian</span>
          <span class="food-caption">Fresh &amp; delicious</span>
        </button>
        <button class="food-option nonveg-option" type="button" aria-pressed="false">
          <span class="food-icon" aria-hidden="true"></span>
          <span class="food-name">Non-vegetarian</span>
          <span class="food-caption">Hearty &amp; tasty</span>
        </button>
      </div>
      <p id="selection-message" class="selection-message" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
