<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Corner</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="start-page" class="card">
    <div class="logo" aria-hidden="true">🍽️</div>
    <p class="eyebrow">YOUR CAMPUS CANTEEN</p>
    <h1>Canteen Corner</h1>

    <section id="welcome-page" aria-labelledby="welcome-title">
      <h2 id="welcome-title">Let's get to know you</h2>
      <p class="intro">Enter your details to get started.</p>

      <form id="welcome-form">
        <label for="customer-name">Your name</label>
        <input
          id="customer-name"
          name="name"
          type="text"
          placeholder="e.g. Alex"
          autocomplete="name"
          required
        >

        <label for="customer-phone">Phone number</label>
        <input
          id="customer-phone"
          name="phone"
          type="tel"
          placeholder="10-digit phone number"
          autocomplete="tel"
          inputmode="numeric"
          pattern="[0-9]{10}"
          title="Please enter a 10-digit phone number."
          required
        >

        <button class="continue-button" type="submit">Enter <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <section id="food-page" aria-labelledby="food-title" hidden>
      <h2 id="food-title">What would you like, <span id="customer-greeting"></span>?</h2>
      <p class="intro">Choose your food preference.</p>

      <div class="food-options">
        <button class="food-option veg-option" type="button" aria-pressed="false">
          <span class="food-icon" aria-hidden="true"></span>
          <span class="food-name">Vegetarian</span>
          <span class="food-caption">Fresh &amp; delicious</span>
        </button>
        <button class="food-option nonveg-option" type="button" aria-pressed="false">
          <span class="food-icon" aria-hidden="true"></span>
          <span class="food-name">Non-vegetarian</span>
          <span class="food-caption">Hearty &amp; tasty</span>
        </button>
      </div>
      <p id="selection-message" class="selection-message" aria-live="polite"></p>
      <button id="menu-button" class="continue-button menu-button" type="button" hidden>
        View menu <span aria-hidden="true">→</span>
      </button>
    </section>
  </main>

  <main id="menu-page" class="menu-page" hidden>
    <header class="page-header">
      <a class="brand" href="index.html">Canteen Corner</a>
      <button id="back-button" class="back-link" type="button">← Back to categories</button>
    </header>

    <div class="menu-container">
      <p class="eyebrow">FRESH FROM OUR KITCHEN</p>
      <h1>Our Menu</h1>
      <p id="menu-greeting" class="intro">Choose an item to see its price.</p>

      <section id="veg-menu" class="menu-section" aria-labelledby="veg-title">
        <h2 id="veg-title"><span class="category-dot veg-dot" aria-hidden="true"></span>Vegetarian</h2>
        <div class="item-grid">
          <button class="menu-item" type="button" aria-expanded="false"><span>Paneer Butter Masala</span><span class="price">₹180</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Veg Biryani</span><span class="price">₹150</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Masala Dosa</span><span class="price">₹90</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Chole Bhature</span><span class="price">₹120</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Veg Fried Rice</span><span class="price">₹130</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Palak Paneer</span><span class="price">₹170</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Margherita Pizza</span><span class="price">₹190</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Veg Hakka Noodles</span><span class="price">₹125</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Dal Tadka</span><span class="price">₹110</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Aloo Paratha</span><span class="price">₹80</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Veg Burger</span><span class="price">₹100</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Mix Veg Curry</span><span class="price">₹140</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Idli Sambar</span><span class="price">₹70</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Veg Manchurian</span><span class="price">₹135</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Mushroom Fried Rice</span><span class="price">₹145</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Cheese Sandwich</span><span class="price">₹95</span></button>
        </div>
      </section>

      <section id="nonveg-menu" class="menu-section" aria-labelledby="nonveg-title">
        <h2 id="nonveg-title"><span class="category-dot nonveg-dot" aria-hidden="true"></span>Non-vegetarian</h2>
        <div class="item-grid">
          <button class="menu-item" type="button" aria-expanded="false"><span>Chicken Biryani</span><span class="price">₹190</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Butter Chicken</span><span class="price">₹220</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Chicken Fried Rice</span><span class="price">₹160</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Egg Curry</span><span class="price">₹120</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Chicken Hakka Noodles</span><span class="price">₹160</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Grilled Chicken Sandwich</span><span class="price">₹150</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Fish Curry</span><span class="price">₹210</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Chicken Burger</span><span class="price">₹140</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Egg Fried Rice</span><span class="price">₹125</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Chicken Tikka</span><span class="price">₹200</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Omelette</span><span class="price">₹75</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Chicken Kathi Roll</span><span class="price">₹130</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Prawn Masala</span><span class="price">₹240</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Chicken 65</span><span class="price">₹180</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Fish Fry</span><span class="price">₹190</span></button>
          <button class="menu-item" type="button" aria-expanded="false"><span>Egg Sandwich</span><span class="price">₹90</span></button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
